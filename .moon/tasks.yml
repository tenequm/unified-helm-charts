$schema: 'https://moonrepo.dev/schemas/tasks.json'

fileGroups:
  sources:
    - templates/**/*
    - .helmignore
    - Chart.yaml
    - values.yaml
    - ci/**/*
    - /shared-templates/**/*

tasks:  
  lint:
    command: 'helm lint'
    inputs: ['@globs(sources)']

  kubeconform:
    command: 'bash $workspaceRoot/scripts/kubeconform.sh'
    inputs: ['@globs(sources)', '/scripts/kubeconform.sh']

  release:
    command: yarn run release
    local: true
    options:
      cache: false
      runInCI: false
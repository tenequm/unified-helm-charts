{{- range $key, $route := .Values.route }}
{{- if $route.enabled }}
{{- $name := include "name" $ }}
---
################################################
# Standardized Templates - Gateway API route
################################################
apiVersion: {{ $route.apiVersion | default "gateway.networking.k8s.io/v1" }}
kind: {{ $route.kind | default "HTTPRoute" }}
metadata:
  name: {{ $name }}{{ if ne $key "main" }}-{{ $key }}{{ end }}
{{- include "labels" $ | indent 2 }}
{{- with $route.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- with $route.annotations }}
  annotations:
{{ tpl (toYaml .) $ | indent 4 }}
{{- end }}
spec:
  parentRefs:
{{- if not $route.parentRefs }}
{{- fail (printf "route.%s.parentRefs is required" $key) }}
{{- end }}
{{ tpl (toYaml $route.parentRefs) $ | indent 4 }}
{{- with $route.hostnames }}
  hostnames:
{{ tpl (toYaml .) $ | indent 4 }}
{{- end }}
  rules:
{{- with $route.additionalRules }}
{{ tpl (toYaml .) $ | indent 4 }}
{{- end }}
{{- if $route.httpsRedirect }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- else }}
    - backendRefs:
{{- if $route.backendRefs }}
{{ tpl (toYaml $route.backendRefs) $ | indent 8 }}
{{- else if $.Values.service.enabled }}
        - name: {{ $name }}
          port: {{ $route.backendPort | default $.Values.service.port }}
{{- else }}
{{- fail (printf "route.%s: service.enabled is false, so set route.%s.backendRefs" $key $key) }}
{{- end }}
{{- with $route.matches }}
      matches:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with $route.filters }}
      filters:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with $route.timeouts }}
      timeouts:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with $route.sessionPersistence }}
      sessionPersistence:
{{ toYaml . | indent 8 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
